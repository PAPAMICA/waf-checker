name = "waf-checker-deploy-2026"
main = "src/api.ts"
compatibility_date = "2025-02-05"
# account_id: set via CLOUDFLARE_ACCOUNT_ID env var or wrangler --account-id flag
[assets]
directory = "./src/static"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
